name: Deploy Pretest

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pretest
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to pretest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is required"
            exit 1
          fi
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is required"
            exit 1
          fi
          SSH_PORT="${VPS_SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          echo "Optional: ssh-keyscan $VPS_HOST (port $SSH_PORT)..."
          if ssh-keyscan -T 25 -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
            echo "ssh-keyscan succeeded"
          else
            echo "::warning::ssh-keyscan failed; using StrictHostKeyChecking=accept-new on first ssh."
            cat /tmp/ssh-keyscan.err || true
            : > ~/.ssh/known_hosts
          fi

      - name: Deploy on VPS (pretest)
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.PRETEST_DEPLOY_PATH }}
          PRETEST_ENV_FILE: ${{ secrets.PRETEST_ENV_FILE }}
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_SSH_PORT:-22}"
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o Port=${SSH_PORT} -o ServerAliveInterval=30 -o ServerAliveCountMax=24"
          if [ -z "${SSH_USER:-}" ]; then
            echo "SSH_USER secret is required"
            exit 1
          fi
          if [ -z "${VPS_HOST:-}" ]; then
            echo "VPS_HOST secret is required"
            exit 1
          fi
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "PRETEST_DEPLOY_PATH secret is required"
            exit 1
          fi
          if [ -z "${PRETEST_ENV_FILE:-}" ]; then
            echo "PRETEST_ENV_FILE secret is required"
            exit 1
          fi

          echo "Checking SSH connectivity to $SSH_USER@$VPS_HOST"
          ssh $SSH_OPTS "$SSH_USER@$VPS_HOST" "echo connected && hostname"

          ssh $SSH_OPTS "$SSH_USER@$VPS_HOST" "set -euo pipefail; mkdir -p \"$DEPLOY_PATH\""
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.nuxt' \
            --exclude '.output' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "$SSH_USER@$VPS_HOST:$DEPLOY_PATH/"
          printf '%s\n' "$PRETEST_ENV_FILE" | ssh $SSH_OPTS "$SSH_USER@$VPS_HOST" "cat > \"$DEPLOY_PATH/../.env.pretest\" && chmod 600 \"$DEPLOY_PATH/../.env.pretest\" && cp \"$DEPLOY_PATH/../.env.pretest\" \"$DEPLOY_PATH/.env\" && chmod 600 \"$DEPLOY_PATH/.env\""
          ssh $SSH_OPTS "$SSH_USER@$VPS_HOST" "set -euo pipefail; \
            cd \"$DEPLOY_PATH\"; \
            docker compose -f docker-compose.pretest.yml pull || true; \
            docker compose -f docker-compose.pretest.yml build --pull; \
            docker compose -f docker-compose.pretest.yml up -d --remove-orphans; \
            docker image prune -f"
